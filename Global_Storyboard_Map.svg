  <rect x="1330" y="390" width="170" height="130" rx="10" class="node outdoor"/><text x="1415" y="449" class="label">ГОРОДОК</text><text x="1415" y="477" class="small">филлерная зона</text>
  <circle cx="1720" cy="455" r="90" class="node boss" filter="url(#glow)"/><text x="1720" y="438" class="label">ДОРОГА</text><text x="1720" y="466" class="small">босс: БТР</text>
  <rect x="1630" y="690" width="180" height="120" rx="10" class="node human"/><text x="1720" y="742" class="label">ВОЕННАЯ</text><text x="1720" y="770" class="label">ЧАСТЬ</text>
  <circle cx="1345" cy="790" r="105" class="node boss" filter="url(#glow)"/><text x="1345" y="780" class="label">БОСС</text><text x="1345" y="809" class="small">вертолёт</text>
  <rect x="880" y="725" width="190" height="130" rx="10" class="node outdoor"/><text x="975" y="784" class="label">ПОЛИГОН</text><text x="975" y="812" class="small">филлерная зона</text>
