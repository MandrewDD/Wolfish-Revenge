<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08121f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="route" x1="0" x2="1"><stop stop-color="#55d7e7"/><stop offset="1" stop-color="#f7b84b"/></linearGradient>
    <pattern id="human" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="14" height="14" fill="#3c2f36"/><rect width="5" height="14" fill="#d99b52" opacity=".45"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#74d9e5"/></marker>
    <style>
      .title{font-family:Arial,sans-serif;font-weight:800;letter-spacing:2px;fill:#eff8ff}.sub{font-family:Arial,sans-serif;font-size:20px;fill:#a7bdcf}.node{stroke-width:3}.outdoor{fill:#12394a;stroke:#62d5e6}.human{fill:url(#human);stroke:#f2b75e}.boss{fill:#54283a;stroke:#ff7088}.final{fill:#792c3a;stroke:#ffb1ba}.label{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#f6fbff;text-anchor:middle}.small{font-family:Arial,sans-serif;font-size:16px;fill:#b9cddb;text-anchor:middle}.route{fill:none;stroke:url(#route);stroke-width:6;stroke-linecap:round;marker-end:url(#arrow)}.side{fill:none;stroke:#d49a56;stroke-width:4;stroke-dasharray:10 9;marker-end:url(#arrow)}.card{fill:#101e2e;stroke:#425b72;stroke-width:2}.cardtext{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#f4f8fb}.weapon{stroke:#f8c65c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.legend{font-family:Arial,sans-serif;font-size:16px;fill:#cad9e8}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M0 850 C280 760 370 970 620 860 S990 760 1190 870 S1560 1000 1920 820" stroke="#244158" stroke-width="2" fill="none" opacity=".55"/>
  <path d="M0 450 C260 380 400 520 640 420 S1080 340 1300 460 S1620 520 1920 420" stroke="#244158" stroke-width="2" fill="none" opacity=".4"/>
