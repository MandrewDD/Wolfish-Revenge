  <path class="side" d="M1415 390 L1415 265"/><ellipse cx="1415" cy="195" rx="155" ry="64" class="node human"/><text x="1415" y="188" class="label">ТЕРМИНАЛ +</text><text x="1415" y="216" class="label">ХРАНИЛИЩЕ</text>
  <path class="side" d="M1720 690 L1720 610 L1510 610"/><ellipse cx="1435" cy="610" rx="95" ry="55" class="node human"/><text x="1435" y="605" class="label">СКЛАД</text><text x="1435" y="630" class="small">опционально</text>
  <path class="side" d="M975 855 L975 960"/><ellipse cx="975" cy="995" rx="100" ry="52" class="node human"/><text x="975" y="1002" class="label">СКЛАД</text>

