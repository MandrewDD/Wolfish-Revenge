  <path class="route" d="M210 455 L360 455"/><path class="route" d="M550 455 L700 455"/><path class="route" d="M870 455 L1010 455"/><path class="route" d="M1190 455 L1330 455"/><path class="route" d="M1500 455 L1630 455"/>
  <path class="route" d="M1720 550 L1720 690"/><path class="route" d="M1620 790 L1450 790"/><path class="route" d="M1240 790 L1070 790"/><path class="route" d="M880 790 L690 790"/>

